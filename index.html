<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance login test</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --text:#1c2430; --muted:#5b6675; --line:#dde2e9; --accent:#1a5fb4; --ok:#1b7a3d; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181f; --card:#1d232d; --text:#e8ecf1; --muted:#9aa5b4; --line:#2e3744; --accent:#6aa5ff; --ok:#5fd08a; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
  main { max-width:460px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .step { font-size:13px; color:var(--muted); margin:0 0 8px; }
  button { font:inherit; font-size:15px; padding:12px 16px; width:100%; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .result { margin-top:10px; font-size:14px; word-break:break-word; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  ul { padding-left:18px; margin:8px 0 0; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Attendance login test</h1>
  <p class="sub">Checks that Google login and the private database work together.</p>

  <div class="card">
    <p class="step">Test 1: sign in</p>
    <button class="primary" id="signin">Sign in with Google</button>
    <div class="result" id="r1"></div>
  </div>

  <div class="card">
    <p class="step">Test 2: save a record</p>
    <button id="save">Save test attendance</button>
    <div class="result" id="r2"></div>
  </div>

  <div class="card">
    <p class="step">Test 3: read my records</p>
    <button id="load">Show my records</button>
    <div class="result" id="r3"></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPqgcZCZpGtzzpmcnaLSRg3ow7qZIlsPg",
  authDomain: "team-attendance-4a21b.firebaseapp.com",
  projectId: "team-attendance-4a21b",
  storageBucket: "team-attendance-4a21b.firebasestorage.app",
  messagingSenderId: "638072926108",
  appId: "1:638072926108:web:746527314ff648b6bb2259"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const show = (id, msg, ok) => { $(id).className = "result " + (ok ? "ok" : "bad"); $(id).textContent = msg; };
let user = null;

onAuthStateChanged(auth, u => {
  user = u;
  if (u) show("r1", "Signed in as " + u.email, true);
});

$("signin").onclick = async () => {
  try {
    const res = await signInWithPopup(auth, new GoogleAuthProvider());
    show("r1", "Signed in as " + res.user.email, true);
  } catch (e) {
    show("r1", "Failed: " + e.code + " - " + e.message, false);
  }
};

$("save").onclick = async () => {
  if (!user) return show("r2", "Sign in first (Test 1).", false);
  try {
    await addDoc(collection(db, "test"), { email: user.email, status: "Present", at: serverTimestamp() });
    show("r2", "Saved to the private database.", true);
  } catch (e) {
    show("r2", "Failed: " + e.code + " - " + e.message, false);
  }
};

$("load").onclick = async () => {
  if (!user) return show("r3", "Sign in first (Test 1).", false);
  try {
    const snap = await getDocs(query(collection(db, "test"), where("email", "==", user.email)));
    if (snap.empty) return show("r3", "No records yet. Run Test 2 first.", false);
    $("r3").className = "result ok";
    $("r3").innerHTML = "Found " + snap.size + " record(s):<ul>" +
      snap.docs.map(d => "<li>" + d.data().status + " by " + d.data().email + "</li>").join("") + "</ul>";
  } catch (e) {
    show("r3", "Failed: " + e.code + " - " + e.message, false);
  }
};
</script>
</body>
</html>
